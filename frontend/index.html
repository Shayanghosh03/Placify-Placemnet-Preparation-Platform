<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Placify - Prepare Smarter, Get Placement Ready</title>
    <!-- Google Fonts: Plus Jakarta Sans & Caveat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <div class="app-boot-loader" role="status" aria-live="polite">
        <div class="app-boot-spinner" aria-hidden="true"></div>
        <span>Loading Placify...</span>
      </div>
    </div>
    <style>
      .app-boot-loader {
        align-items: center;
        background: #ffffff;
        color: #64748b;
        display: flex;
        flex-direction: column;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 0.95rem;
        gap: 14px;
        justify-content: center;
        min-height: 100vh;
      }

      .app-boot-spinner {
        animation: app-boot-spin 0.7s linear infinite;
        border: 3px solid #e2e8f0;
        border-radius: 50%;
        border-top-color: #594dfa;
        height: 28px;
        width: 28px;
      }

      @keyframes app-boot-spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
